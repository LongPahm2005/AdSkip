name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: youtube-ad-tools/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: youtube-ad-tools

      - name: Check version consistency
        run: npm run check:version
        working-directory: youtube-ad-tools

      - name: Lint
        run: npm run lint
        working-directory: youtube-ad-tools

      - name: Run unit tests
        run: npm run test:unit
        working-directory: youtube-ad-tools

      - name: Build production extension
        run: npm run build
        working-directory: youtube-ad-tools

      - name: Validate packaged extension
        run: npm run test:package
        working-directory: youtube-ad-tools

      - name: Create extension ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: youtube-ad-tools
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p artifacts
          (cd dist && zip -qr "../artifacts/youtube-ad-tools-v${version}.zip" .)
          unzip -t "artifacts/youtube-ad-tools-v${version}.zip"

      - name: Upload installable ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ad-tools-zip
          path: youtube-ad-tools/artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unpacked extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ad-tools-unpacked
          path: youtube-ad-tools/dist/
          if-no-files-found: error
          retention-days: 14
